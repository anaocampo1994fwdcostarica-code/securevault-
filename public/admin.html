<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureVault - Administración</title>
  <link rel="stylesheet" href="/css/styles.css">
  <!-- A02/A05: scripts externos con defer, compatible con CSP -->
  <script src="/js/api.js" defer></script>
  <script src="/js/admin.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">SecureVault — Administración</div>
    <nav class="topbar-nav">
      <a href="/notes.html" class="btn btn-secondary">Mis notas</a>
      <a href="/profile.html" class="btn btn-secondary">Perfil</a>
      <button id="logout-btn" type="button" class="btn btn-danger">Cerrar sesión</button>
    </nav>
  </header>

  <main class="container">
    <div id="alert" class="alert hidden" role="alert"></div>

    <section id="admin-content">
      <div class="card">
        <h2>Usuarios</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Rol</th>
                <th>Intentos fallidos</th>
                <th>Bloqueado hasta</th>
              </tr>
            </thead>
            <tbody id="users-tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h2>Bitácora de auditoría (últimos 50 eventos)</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Evento</th>
                <th>Usuario</th>
                <th>IP</th>
                <th>Metadatos</th>
                <th>Fecha</th>
              </tr>
            </thead>
            <tbody id="audit-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
