<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureVault - Iniciar sesión</title>
  <!-- A08: hoja de estilos y logo SVG locales, sin CDN -->
  <link rel="stylesheet" href="/css/styles.css">
  <!-- A02/A05: scripts externos con defer, cero JS inline -->
  <script src="/js/api.js" defer></script>
  <script src="/js/login.js" defer></script>
</head>
<body>
  <main class="page-main">
    <div class="login-shell">
      <section class="brand-panel">
        <div class="brand-header">
          <img src="/img/shield.svg" alt="Escudo SecureVault" class="brand-logo">
          <h1 class="brand-title">SecureVault</h1>
        </div>
        <p class="brand-subtitle">
          Consola de seguridad para gestión de notas y cuentas con controles reales OWASP Top 10:2025.
        </p>
        <ul id="controls-list" class="controls-list"></ul>
      </section>

      <section class="card">
        <h2>Bienvenido de nuevo</h2>
        <p class="hint">Ingresa tus credenciales para acceder a tu bóveda.</p>
        <div id="alert" class="alert hidden" role="alert"></div>

        <form id="login-form">
          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="nombre@correo.com" required>
          </div>
          <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="password-wrap">
              <input id="password" name="password" type="password" autocomplete="current-password" required>
              <button id="toggle-password" type="button" class="toggle-pass-btn" aria-label="Mostrar u ocultar contraseña"></button>
            </div>
          </div>
          <button type="submit" class="btn-full">Iniciar sesión</button>
        </form>

        <div class="links">
          <a href="/forgot.html">¿Olvidaste tu contraseña?</a>
          <a href="/register.html">Crear una cuenta nueva</a>
        </div>
      </section>
    </div>
  </main>

  <footer class="footer">SecureVault · Laboratorio OWASP Top 10:2025</footer>
</body>
</html>
