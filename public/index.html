<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureVault - Iniciar sesión</title>
  <!-- A08: hoja de estilos local sin CDN -->
  <link rel="stylesheet" href="/css/styles.css">
  <!-- A02/A05: scripts externos con defer, cero JS inline -->
  <script src="/js/api.js" defer></script>
  <script src="/js/login.js" defer></script>
</head>
<body>
  <main class="auth-container">
    <section class="card">
      <h1>SecureVault</h1>
      <p class="hint">Inicia sesión para acceder a tus notas cifradas.</p>
      <div id="alert" class="alert hidden" role="alert"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit">Iniciar sesión</button>
      </form>

      <div class="links">
        <a href="/register.html">Crear una cuenta</a>
        <a href="/forgot.html">¿Olvidaste tu contraseña?</a>
      </div>
    </section>
  </main>
</body>
</html>
