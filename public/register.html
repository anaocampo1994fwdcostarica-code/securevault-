<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureVault - Registro</title>
  <link rel="icon" href="/img/shield.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
  <!-- A02/A05: scripts externos con defer, cero JS inline -->
  <script src="/js/api.js" defer></script>
  <script src="/js/register.js" defer></script>
</head>
<body>
  <main class="page-main">
    <div class="auth-container">
      <section class="card">
        <div class="brand-header">
          <img src="/img/shield.svg" alt="Escudo SecureVault" class="brand-logo">
          <div>
            <h1>Crear cuenta</h1>
            <p class="hint">Registro protegido con Argon2id y validación estricta.</p>
          </div>
        </div>
        <div id="alert" class="alert hidden" role="alert"></div>

        <form id="register-form">
          <div class="form-group">
            <label for="name">Nombre</label>
            <input id="name" name="name" type="text" minlength="2" maxlength="80" autocomplete="name" required>
          </div>
          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" maxlength="254" autocomplete="email" required>
          </div>
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
            <ul class="req-list" aria-live="polite">
              <li id="req-len" class="req-item">○ Mínimo 12 caracteres (máximo 128)</li>
              <li id="req-upper" class="req-item">○ Al menos una letra mayúscula</li>
              <li id="req-lower" class="req-item">○ Al menos una letra minúscula</li>
              <li id="req-num" class="req-item">○ Al menos un número</li>
              <li id="req-sym" class="req-item">○ Al menos un símbolo</li>
            </ul>
          </div>
          <button type="submit" class="btn-full">Registrarse</button>
        </form>

        <div class="links">
          <a href="/index.html">Volver a iniciar sesión</a>
        </div>
      </section>
    </div>
  </main>

  <footer class="footer">SecureVault · Laboratorio OWASP Top 10:2025</footer>
</body>
</html>
