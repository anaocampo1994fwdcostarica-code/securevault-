<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureVault - Registro</title>
  <link rel="stylesheet" href="/css/styles.css">
  <!-- A02/A05: scripts externos con defer, compatible con CSP -->
  <script src="/js/api.js" defer></script>
  <script src="/js/register.js" defer></script>
</head>
<body>
  <main class="auth-container">
    <section class="card">
      <h1>Crear cuenta</h1>
      <div id="alert" class="alert hidden" role="alert"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="name">Nombre</label>
          <input id="name" name="name" type="text" minlength="2" maxlength="80" autocomplete="name" required>
        </div>
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" maxlength="254" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
          <p class="hint">
            Requisitos: mínimo 12 caracteres, al menos una mayúscula, una minúscula, un número y un símbolo.
          </p>
        </div>
        <button type="submit">Registrarse</button>
      </form>

      <div class="links">
        <a href="/index.html">Volver a iniciar sesión</a>
      </div>
    </section>
  </main>
</body>
</html>
