<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureVault - Restablecer contraseña</title>
  <link rel="stylesheet" href="/css/styles.css">
  <!-- A02/A05: scripts externos con defer, cero JS inline -->
  <script src="/js/api.js" defer></script>
  <script src="/js/reset.js" defer></script>
</head>
<body>
  <main class="page-main">
    <div class="auth-container">
      <section class="card">
        <div class="brand-header">
          <img src="/img/shield.svg" alt="Escudo SecureVault" class="brand-logo">
          <div>
            <h1>Nueva contraseña</h1>
            <p class="hint">Al actualizarla se cerrarán tus sesiones activas.</p>
          </div>
        </div>
        <div id="alert" class="alert hidden" role="alert"></div>

        <form id="reset-form">
          <div class="form-group">
            <label for="password">Nueva contraseña</label>
            <input id="password" name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
            <p class="hint">
              Mínimo 12 caracteres, mayúscula, minúscula, número y símbolo.
            </p>
          </div>
          <button type="submit" class="btn-full">Actualizar contraseña</button>
        </form>

        <div class="links">
          <a href="/index.html">Volver a iniciar sesión</a>
        </div>
      </section>
    </div>
  </main>

  <footer class="footer">SecureVault · Laboratorio OWASP Top 10:2025</footer>
</body>
</html>
