<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureVault - Recuperar contraseña</title>
  <link rel="stylesheet" href="/css/styles.css">
  <!-- A02/A05: scripts externos con defer, cero JS inline -->
  <script src="/js/api.js" defer></script>
  <script src="/js/forgot.js" defer></script>
</head>
<body>
  <main class="auth-container">
    <section class="card">
      <h1>Recuperar contraseña</h1>
      <p class="hint">Ingresa tu correo y te enviaremos instrucciones si la cuenta existe.</p>
      <div id="alert" class="alert hidden" role="alert"></div>

      <form id="forgot-form">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" maxlength="254" autocomplete="email" required>
        </div>
        <button type="submit">Enviar instrucciones</button>
      </form>

      <div class="links">
        <a href="/index.html">Volver a iniciar sesión</a>
      </div>
    </section>
  </main>
</body>
</html>
