<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureVault - Recuperar contraseña</title>
  <link rel="icon" href="/img/shield.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
  <!-- A02/A05: scripts externos con defer, cero JS inline -->
  <script src="/js/api.js" defer></script>
  <script src="/js/forgot.js" defer></script>
</head>
<body>
  <main class="page-main">
    <div class="auth-container">
      <section class="card">
        <div class="brand-header">
          <img src="/img/shield.svg" alt="Escudo SecureVault" class="brand-logo">
          <div>
            <h1>Recuperar contraseña</h1>
            <p class="hint">Genera un enlace de un solo uso válido por 15 minutos.</p>
          </div>
        </div>
        <div id="alert" class="alert hidden" role="alert"></div>

        <form id="forgot-form">
          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" maxlength="254" autocomplete="email" required>
          </div>
          <button type="submit" class="btn-full">Enviar instrucciones</button>
        </form>

        <div class="links">
          <a href="/index.html">Volver a iniciar sesión</a>
        </div>
      </section>
    </div>
  </main>

  <footer class="footer">SecureVault · Laboratorio OWASP Top 10:2025</footer>
</body>
</html>
