name: CI de seguridad

# Se ejecuta en cada push a main y ana, y en cada pull request hacia main
on:
  push:
    branches: [main, ana]
  pull_request:
    branches: [main]

# Minimo privilegio: el pipeline solo puede leer el repositorio
permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v5

      - name: Configurar Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # A03: instalacion reproducible, exactamente lo que dice package-lock.json
      - name: Instalar dependencias
        run: npm ci

      # A08: las pruebas deben pasar antes de llegar a produccion
      - name: Ejecutar pruebas
        run: npm test

      # A03: falla si hay vulnerabilidades altas o criticas
      - name: Auditar dependencias
        run: npm audit --audit-level=high
